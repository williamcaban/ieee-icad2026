# LightEval configuration for local evaluation via OpenRouter
# Used in Section 02 Track C (local evaluation, no Kubernetes).
#
# Variables substituted at runtime from .workshop-env:
#   ${MODEL_ENDPOINT}     → https://openrouter.ai/api/v1  (or Ollama/vLLM)
#   ${MODEL_NAME}         → liquid/lfm-2.5-1.2b-instruct:free
#   ${OPENROUTER_API_KEY} → your API key (used as OPENAI_API_KEY)

# ── Preferred path: run via evalhub (local mode) ─────────────────────────────
#
# evalhub eval run \
#   --name "act1-truthfulqa-lighteval" \
#   --provider lighteval \
#   --benchmark truthfulqa_lighteval \
#   --model-url "${MODEL_ENDPOINT}" \
#   --model-name "${MODEL_NAME}" \
#   --param limit=5 --wait
#
# evalhub eval run \
#   --name "act1-winogender-lighteval" \
#   --provider lighteval \
#   --benchmark winogender_lighteval \
#   --model-url "${MODEL_ENDPOINT}" \
#   --model-name "${MODEL_NAME}" \
#   --param limit=5 --wait

# ── Fallback: run lighteval directly (bypass evalhub) ────────────────────────
#
# TruthfulQA (LLM09 — Overreliance / hallucination):
#   python -m lighteval endpoint \
#     --endpoint_type openai \
#     --endpoint_url "${MODEL_ENDPOINT}/v1" \
#     --model_name "${MODEL_NAME}" \
#     --tasks "lighteval|truthfulqa:mc|0|0" \
#     --max_samples 5 \
#     --output_dir ./results/lighteval
#
# WinoGender (LLM06 — gender co-reference bias):
#   python -m lighteval endpoint \
#     --endpoint_type openai \
#     --endpoint_url "${MODEL_ENDPOINT}/v1" \
#     --model_name "${MODEL_NAME}" \
#     --tasks "lighteval|winogender|0|0" \
#     --max_samples 5 \
#     --output_dir ./results/lighteval

# ── Benchmark → taxonomy mapping ─────────────────────────────────────────────
benchmarks:
  - id: truthfulqa_lighteval
    lighteval_task: "lighteval|truthfulqa:mc|0|0"
    owasp: LLM09
    avid: E0303
    cwe: CWE-1039
    pass_threshold: 0.50
    primary_metric: mc1

  - id: winogender_lighteval
    lighteval_task: "lighteval|winogender|0|0"
    owasp: LLM06
    avid: E0101
    cwe: CWE-200
    pass_threshold: 0.60
    primary_metric: acc
