[project]
name = "ieee-icad2026-workshop"
version = "0.1.0"
description = "Guardrails Under Pressure: Hands-On LLM Safety Evaluation — IEEE ICAD 2026 Workshop"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Section 02 — lm-evaluation-harness (baseline replication)
    "lm-eval>=0.4",
    # Section 02 — Garak red-teaming framework (adversarial baseline)
    "garak>=0.9",
    # Section 03 — Inter-Rater Reliability computation (novel contribution)
    "krippendorff>=0.6",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    # Section 03 — EvalHub benchmark registration API calls
    "requests>=2.28",
    # Section 04 — Jupyter notebook for MCP comparison
    "notebook>=7.0",
    "ipykernel>=6.0",
    # Section 04 — Side-by-side comparison visualisation
    "matplotlib>=3.7",
    # Shared — YAML config parsing in setup scripts
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "eval-hub-sdk[adapter,cli,client]>=0.4",
    "eval-hub-server>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ipython>=8.0",
]
guardrails = [
    # Guardrails demo — install separately to avoid heavy deps in core env:
    #   uv pip install "ieee-icad2026-workshop[guardrails]"
    # or let guardrails/setup.sh install it automatically.
    "nemoguardrails>=0.9",
]

[tool.uv]
# Don't install this repo as a Python package — it's a scripts-only workshop.
# uv sync installs all dependencies into .venv without trying to build a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: subprocess-level tests requiring HuggingFace internet access",
    "integration: full pipeline tests requiring OPENROUTER_API_KEY and network",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
