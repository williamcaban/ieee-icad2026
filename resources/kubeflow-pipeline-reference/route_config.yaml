# InferenceService — Production model serving configuration
#
# This YAML shows the InferenceService resource that the pipeline's
# route_traffic component patches. The pipeline updates the annotations
# to record which model won the safety evaluation, then swaps the active
# predictor to the winning endpoint.
#
# In the workshop, this IS is pre-deployed by the facilitator. The pipeline
# will patch it based on the evaluation outcome.

apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-production
  namespace: workshop-eval
  labels:
    workshop: icad2026
    component: production-endpoint
  annotations:
    # These annotations are updated by the pipeline after each evaluation run.
    # They serve as an audit trail: which model is active and why.
    workshop.icad2026/winner: "not-yet-evaluated"
    workshop.icad2026/last-eval-run: ""
    workshop.icad2026/last-eval-score: ""
    workshop.icad2026/last-eval-collection: "safety-and-fairness-v1"
    workshop.icad2026/last-eval-timestamp: ""

    # OpenShift Route annotation for external access
    serving.kserve.io/deploymentMode: RawDeployment

spec:
  predictor:
    # --- ACTIVE MODEL (pipeline updates this block) ---
    # The pipeline replaces the model URI here to point to the winning model.
    # Initially points to the baseline model.
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: "s3://workshop-models/granite-3-2b-baseline"
      resources:
        limits:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: "8Gi"

    # --- CANARY DEPLOYMENT (optional advanced configuration) ---
    # Uncomment and fill in to enable weighted traffic splitting between
    # two model versions before the pipeline makes its final routing decision.
    #
    # canaryTrafficPercent: 10   # send 10% of traffic to canary
    # canary:
    #   model:
    #     modelFormat:
    #       name: vLLM
    #     runtime: vllm-runtime
    #     storageUri: "s3://workshop-models/granite-3-2b-candidate"

---
# OpenShift Route for external access to the production endpoint.
# This is created automatically by the InferenceService controller.
# Shown here for reference — do not apply separately.
