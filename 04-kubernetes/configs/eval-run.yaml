apiVersion: trustyai.opendatahub.io/v1alpha1
kind: LMEvalJob
metadata:
  name: icad2026-cluster-eval
  namespace: ${WORKSHOP_NAMESPACE}
  labels:
    workshop: icad2026
    section: "03"
spec:
  # Model type: openai-chat-completions works with OpenRouter free models
  model: openai-chat-completions

  modelArgs:
    # OpenRouter base URL (OpenAI-compatible)
    - name: base_url
      value: "${MODEL_ENDPOINT}/chat/completions"
    # Model name on OpenRouter — free tier
    - name: model
      value: "${MODEL_NAME}"
    # Use cl100k_base as tokenizer approximation (avoids model-name lookup errors)
    - name: tokenizer
      value: cl100k_base

  # Required for openai-chat-completions model type
  chatTemplate:
    enabled: true

  # Allow online access — required for OpenRouter calls
  allowOnline: true

  # Tasks from lm-evaluation-harness
  taskList:
    taskNames:
      - bbq_generate        # intersectional bias — generative (generate_until)
      - mmlu_business_ethics_generative      # ethics alignment — generative

  # Keep sample outputs for analysis
  logSamples: true

  # 5 samples × 2 tasks = 10 API calls — stays within free-tier 20 req/min limit
  limit: "5"

  # Environment variable for the API key is injected via the secret below.
  # The lm-eval openai-chat-completions driver reads OPENAI_API_KEY.
  pod:
    container:
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openrouter-credentials
              key: OPENROUTER_API_KEY
        # Tell OpenRouter which app is calling (for free-tier prioritization)
        - name: OPENAI_ORGANIZATION
          value: "ieee-icad2026-workshop"
